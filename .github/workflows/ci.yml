name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Report dependency advisories
        run: |
          npm audit --json > audit.json || true
          node -e 'const a=require("./audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(name + " | " + v.severity + " | direct=" + v.isDirect + " | fix=" + JSON.stringify(v.fixAvailable) + " | via=" + v.via.map(x => typeof x === "string" ? x : x.title).join("; "))'
      - run: npm run lint
      - run: npm run build
